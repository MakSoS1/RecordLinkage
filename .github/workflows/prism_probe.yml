name: prism-one-time-encrypted-probe

on:
  push:
    branches: [main]
    paths:
      - "prism_trigger/**"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Capture untrusted banner
        shell: bash
        run: |
          set -euo pipefail
          rm -rf prism_result
          mkdir -p prism_result/raw
          python3 - <<'PY'
          import socket, ssl, time
          host='rwp2xfbj6nbit7iujybvt5ubdpu.cloud.d3c.tf'
          raw=socket.create_connection((host,443),timeout=12)
          s=ssl.create_default_context().wrap_socket(raw,server_hostname=host)
          s.settimeout(1)
          out=bytearray()
          end=time.time()+7
          sent=False
          while time.time()<end:
              try:
                  b=s.recv(65536)
                  if not b: break
                  out+=b
              except socket.timeout:
                  if not sent and time.time()>end-3:
                      s.sendall(b'\n'); sent=True
          open('prism_result/raw/banner.bin','wb').write(out)
          s.close()
          PY
      - name: Encrypt and commit
        shell: bash
        run: |
          set -euo pipefail
          cat > prism_result/pub.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAtJ+YjwzF2hhM3IszVeea
          HhtKRvHBzrZ+tfji3qRnpGQOOj/wLEP0OoiLjwg9KtJZumqGvgj63/eym/1NoLWk
          3LShUkvoITy+rk5C7Vdb3IQVyZfJHFBiMgFLvEJC9/yuoPuArARsDRP34vPcmS6x
          gaEgWK/NPBsAqEviQnq6H3aMuhT2CvD9KSJflrTAJxiWN0x8sbW1URNRyNR8ZSSm
          6HuQ6U1McCsfIFUSqk5Dpa43c/Z7i5DncRSHyYRkPq4QV/Pk6HNnjoq7PEmrj/NW
          rmyMnB/0GVZbQe3aG9Ym0Ke6PjPQnsHmmVIUf+YQ0l4+l038s6WLlIhllTYip2qa
          zfChJS/bDVjNYvSHydX8q9KpCQsc+H8qan7Jd7JL+jJtwLKOO1UeQt7Glphjzd6Q
          oUrhWkUzl+yC0sU0O6odWAdF0wJ4bLu2uc+aZujQ4ZYVQ8x8Zo06y1yZMvu4PJWW
          uplZCEiJ+25c7q+r+sy2CamuPA7pifg1y7LQSt0PG72RAgMBAAE=
          -----END PUBLIC KEY-----
          EOF
          tar -C prism_result/raw -czf prism_result/data.tgz .
          openssl rand -out prism_result/key 32
          openssl rand -out prism_result/iv 16
          K=$(xxd -p -c256 prism_result/key); I=$(xxd -p -c256 prism_result/iv)
          openssl enc -aes-256-cbc -K "$K" -iv "$I" -in prism_result/data.tgz -out prism_result/data.enc
          cat prism_result/key prism_result/iv > prism_result/keyiv
          openssl pkeyutl -encrypt -pubin -inkey prism_result/pub.pem -pkeyopt rsa_padding_mode:oaep -in prism_result/keyiv -out prism_result/keyiv.enc
          base64 -w0 prism_result/data.enc > prism_result/data.enc.b64
          base64 -w0 prism_result/keyiv.enc > prism_result/keyiv.enc.b64
          rm -rf prism_result/raw prism_result/pub.pem prism_result/data.tgz prism_result/data.enc prism_result/key prism_result/iv prism_result/keyiv prism_result/keyiv.enc
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prism_result/data.enc.b64 prism_result/keyiv.enc.b64
          git commit -m 'Add encrypted PRISM banner result' || exit 0
          git push
